data:
  data_dir: null
  train_split: train
  val_split: val
  max_train_samples: null
  max_val_samples: null

model:
  name: retinanet
  backbone: resnet50_fpn
  num_classes: 7
  pretrained: true
  min_size: 800
  max_size: 1333
  box_score_thresh: 0.05
  box_nms_thresh: 0.5
  anchors:
    enabled: true
    sizes:
      - [16, 32, 64]
      - [32, 64, 128]
      - [64, 128, 256]
      - [128, 256, 512]
      - [256, 512, 768]
    aspect_ratios:
      - [0.25, 0.5, 1.0, 2.0, 4.0]
      - [0.25, 0.5, 1.0, 2.0, 4.0]
      - [0.25, 0.5, 1.0, 2.0, 4.0]
      - [0.25, 0.5, 1.0, 2.0, 4.0]
      - [0.25, 0.5, 1.0, 2.0, 4.0]

optimizer:
  name: sgd
  lr: 0.003
  momentum: 0.9
  weight_decay: 0.0005

scheduler:
  name: cosine
  t_max: null

training:
  seed: 42
  epochs: 20
  batch_size: 4
  num_workers: 4
  device: cuda
  output_dir: outputs/retinanet_resnet50_albu

early_stopping:
  patience: 4
  min_delta: 0.001

ema:
  enabled: false
  decay: 0.999

tta:
  enabled: false
  horizontal_flip: false

augmentations:
  train:
    horizontal_flip: true
    brightness_contrast: true
    motion_blur: true
    gauss_noise: true
    affine: false
  valid:
    enabled: false
