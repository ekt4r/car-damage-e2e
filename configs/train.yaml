data:
  data_dir: data/raw/CarDD_COCO
  train_split: train
  val_split: val
  max_train_samples: 32

model:
  name: fasterrcnn_mobilenet_v3_large_fpn
  num_classes: 7
  pretrained: true

training:
  epochs: 1
  batch_size: 1
  num_workers: 0
  device: auto
  output_dir: outputs/debug_fasterrcnn

optimizer:
  name: sgd
  lr: 0.005
  momentum: 0.9
  weight_decay: 0.0005