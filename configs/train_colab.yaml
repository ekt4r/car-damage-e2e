model:
  name: fasterrcnn
  backbone: mobilenet_v3_large_fpn
  num_classes: 7
  pretrained: true
  min_size: 800
  max_size: 1333

optimizer:
  name: sgd
  lr: 0.003
  momentum: 0.9
  weight_decay: 0.0005

scheduler:
  name: cosine
  t_max: null

ema:
  enabled: false
  decay: 0.999

tta:
  enabled: false
  horizontal_flip: true

augmentations:
  train:
    horizontal_flip: true
    brightness_contrast: true
    motion_blur: true
    gauss_noise: true
    affine: false
  valid:
    enabled: false