data:
  data_dir: /content/drive/MyDrive/datasets/CarDD_COCO
  train_split: train
  val_split: val
  max_train_samples: null

model:
  num_classes: 7
  pretrained: true

training:
  epochs: 19
  batch_size: 8
  num_workers: 4
  device: cuda
  output_dir: /content/car-damage-e2e/outputs/fasterrcnn_baseline

optimizer:
  lr: 0.005
  momentum: 0.9
  weight_decay: 0.0005

evaluation:
  metric: map
  patience: 2
  min_delta: 0.001